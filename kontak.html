<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontak - Layout Sederhana</title>
<link rel="stylesheet" href="style.css">
<style>
.contact-form {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px 0;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #333;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 10px 15px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-family: 'Open Sans', sans-serif;
  font-size: 14px;
  box-sizing: border-box;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: #428bca;
  outline: none;
}

.form-group textarea {
  height: 150px;
  resize: vertical;
}

.contact-info {
  background: #f9f9f9;
  padding: 20px;
  border-radius: 5px;
  margin-bottom: 30px;
}

.contact-info p {
  margin-bottom: 10px;
  line-height: 25px;
}
</style>
</head>
<body>
<div id="container">
  <header>
    <h1>Kontak</h1>
  </header>

  <nav>
    <a href="home.html">Home</a>
    <a href="artikel.html">Artikel</a>
    <a href="about.html">About</a>
    <a href="kontak.html" class="active">Kontak</a>
  </nav>

  <section id="main" style="float:none; width:auto; padding:30px;">
    <div class="contact-info">
      <h2>Hubungi Kami</h2>
      <p>Jika Anda memiliki pertanyaan, jangan ragu untuk mengirim pesan melalui form di bawah ini.</p>
      <p>Email: info@pelitabangsa.ac.id</p>
      <p>Alamat: Universitas Pelita Bangsa, Bekasi</p>
    </div>

    <div class="contact-form">
      <form action="#" method="POST">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>
        </div>

        <div class="form-group">
          <label for="subjek">Subjek</label>
          <input type="text" id="subjek" name="subjek" placeholder="Masukkan subjek pesan">
        </div>

        <div class="form-group">
          <label for="message">Pesan</label>
          <textarea id="message" name="message" placeholder="Tulis pesan Anda di sini..." required></textarea>
        </div>

        <button type="submit" class="btn">Kirim Pesan</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2021 - Universitas Pelita Bangsa</p>
  </footer>
</div>
</body>
</html>
